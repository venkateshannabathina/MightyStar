<script>(function(){
'use strict';
const stage=document.querySelector('#reference-carousel'),login=document.querySelector('.layout'),items=[...stage.querySelectorAll('.carousel-item')],announcement=stage.querySelector('[role="status"]'),nameLabel=stage.querySelector('.carousel-name');
let selected=0,busy=false,pending=0,animations=[],generation=0,wheelAmount=0,wheelTimer=0,pointer=null;
function confirmCharacter(){if(stage.hidden||busy)return;window.webkit?.messageHandlers?.onboarding?.postMessage({action:'select',character:items[selected].dataset.character});}
window.mightyOnboardingRetry=()=>stage.focus({preventScroll:true});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function relative(i,center){let r=(i-center+items.length)%items.length;return r>items.length/2?r-items.length:r;}
function geometry(){const w=stage.clientWidth,h=stage.clientHeight;return {w,h,d:Math.min(w*.30,h*.515),x:w*.32,y:h*.5,shift:w*.05,gap:h*.396};}
function pose(r,g,small=false){return {x:g.x+(r===0?0:g.shift),y:g.y+r*g.gap,scale:r===0&&!small?1:1/3,opacity:Math.abs(r)>1?0:r===0?1:.65};}
function transform(p,g){return `translate3d(${p.x-g.d/2}px,${p.y-g.d/2}px,0) scale(${p.scale})`;}
function apply(el,p,g){el.style.transform=transform(p,g);el.style.opacity=p.opacity;}
function render(){if(stage.hidden)return;const g=geometry();items.forEach((el,i)=>{const r=relative(i,selected);el.style.width=g.d+'px';el.style.height=g.d+'px';el.style.zIndex=r===0?'3':'1';el.tabIndex=r===0?0:-1;el.setAttribute('aria-current',r===0?'true':'false');el.setAttribute('aria-hidden',Math.abs(r)>1?'true':'false');el.style.pointerEvents=Math.abs(r)>1?'none':'auto';apply(el,pose(r,g),g);});nameLabel.textContent=items[selected].dataset.name;nameLabel.style.opacity='1';announcement.textContent=`${items[selected].dataset.name}, ${selected+1} of ${items.length}`;}
function cancel(){generation++;animations.forEach(a=>a.cancel());animations=[];busy=false;pending=0;}
async function step(direction){if(stage.hidden)return;direction=Math.sign(direction);if(!direction)return;if(busy){pending=direction;return;}
 const previous=selected;selected=(selected+direction+items.length)%items.length;const g=geometry(),token=++generation;busy=true;
 const duration=reduced.matches?0:260;
 animations=items.map((el,i)=>{const before=relative(i,previous),after=relative(i,selected),start=pose(before,g),end=pose(after,g);let second={...start},third={...end};if(before===0)second=pose(0,g,true);if(after===0)third=pose(0,g,true);if(Math.abs(before)>1&&Math.abs(after)>1){start.opacity=second.opacity=third.opacity=end.opacity=0;}el.style.zIndex=before===0||after===0?'3':'1';const frames=[{...start,offset:0},{...second,offset:.22},{...third,offset:.78},{...end,offset:1}].map(p=>({transform:transform(p,g),opacity:p.opacity,offset:p.offset}));return el.animate(frames,{duration,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});});
 await Promise.all(animations.map(a=>a.finished.catch(()=>{})));if(token!==generation)return;animations.forEach(a=>a.cancel());animations=[];busy=false;render();if(pending){const next=Math.sign(pending);pending-=next;step(next);}
}
window.enterCarousel=function(){cancel();selected=0;login.hidden=true;login.inert=true;stage.hidden=false;render();stage.querySelector('.next').focus({preventScroll:true});};
window.exitCarousel=function(){cancel();stage.hidden=true;login.hidden=false;login.inert=false;document.querySelector('#google').focus({preventScroll:true});};
stage.querySelector('.previous').addEventListener('click',()=>step(-1));stage.querySelector('.next').addEventListener('click',()=>step(1));
items.forEach((el,i)=>el.addEventListener('click',()=>{const r=relative(i,selected);if(r)step(Math.sign(r));else confirmCharacter();}));
stage.querySelector('.enter-hint').addEventListener('click',confirmCharacter);
addEventListener('keydown',e=>{if(stage.hidden)return;if(e.key==='Enter'){e.preventDefault();confirmCharacter();return;}if(e.key==='Escape'){e.preventDefault();exitCarousel();return;}if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();step(e.key==='ArrowRight'||e.key==='ArrowDown'?1:-1);}});
stage.addEventListener('wheel',e=>{e.preventDefault();clearTimeout(wheelTimer);wheelAmount+=(e.deltaY||e.deltaX)*(e.deltaMode===1?16:e.deltaMode===2?stage.clientHeight:1);wheelTimer=setTimeout(()=>{wheelAmount=0;},130);if(Math.abs(wheelAmount)>40){step(Math.sign(wheelAmount));wheelAmount=0;}},{passive:false});
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.carousel-arrow'))return;pointer={x:e.clientX,y:e.clientY,id:e.pointerId};});
stage.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dy=pointer.y-e.clientY,dx=pointer.x-e.clientX;pointer=null;if(Math.abs(dy)>45||Math.abs(dx)>45)step(Math.abs(dy)>Math.abs(dx)?Math.sign(dy):Math.sign(dx));});stage.addEventListener('pointercancel',()=>pointer=null);
addEventListener('resize',()=>{if(stage.hidden)return;cancel();render();});
window.mightyOnboardingCarouselInspect=()=>({visible:!stage.hidden,index:selected,name:items[selected].dataset.name,busy,pending,count:items.length,geometry:stage.hidden?null:geometry()});
})();
</script>
