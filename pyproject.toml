[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mighty-star-mind"
version = "0.1.0"
description = "Procedural companion emotion, mood and grudge engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "groq>=0.13,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["mind*"]

[tool.setuptools.package-data]
mind = ["persona.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
